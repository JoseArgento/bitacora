name: page

# Publishes the web companion with GitHub Pages (Settings → Pages → Source: GitHub Actions):
# /            the logbook look (dist/bitacora.html)
# /taberna.html the tavern look
on:
  push:
    branches: [main]
    paths: ["web/**", "tests/fixtures/**", "tools/build_web.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_web.py
      - run: cp dist/bitacora.html dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
