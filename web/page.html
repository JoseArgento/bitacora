<title>Bitácora de a bordo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Leé el diario, el álbum y la libreta de tus personajes de WoW Forever. Todo queda en tu compu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ship's logbook. A ruled ledger (hour · level · entry · place) under a particulars line, with the album and notebook as further sections of the same book. */
:root {
  --paper: #e8ece4;      /* sage chart paper */
  --sheet: #f5f7f1;
  --ink: #18212c;
  --muted: #586470;
  --rule: #c5cec3;
  --accent: #24507a;     /* log ink blue: links, active tab */
  --accent-ink: #f5f7f1;
  --mark: #9a6b17;       /* brass: milestones */
  --death: #9e3328;
  --hatch: #d9dfd4;
  --q0: #6c6c6c; --q1: #18212c; --q2: #1d7a12; --q3: #0b5cad; --q4: #7a2db8; --q5: #b25600; --q6: #85682a; --q7: #00718f; --qq: #826400;
  --display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151c; --sheet: #151d26; --ink: #e1e7ec; --muted: #94a1ad; --rule: #2a3642; --accent: #8db6df; --accent-ink: #0f151c;
    --mark: #d8a64c; --death: #e57e6d; --hatch: #1d2731;
    --q0: #9d9d9d; --q1: #ffffff; --q2: #4ade3a; --q3: #4aa3ff; --q4: #c387f5; --q5: #ff9a33; --q6: #e6cc80; --q7: #33d6ff; --qq: #ffd84a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151c; --sheet: #151d26; --ink: #e1e7ec; --muted: #94a1ad; --rule: #2a3642; --accent: #8db6df; --accent-ink: #0f151c;
  --mark: #d8a64c; --death: #e57e6d; --hatch: #1d2731;
  --q0: #9d9d9d; --q1: #ffffff; --q2: #4ade3a; --q3: #4aa3ff; --q4: #c387f5; --q5: #ff9a33; --q6: #e6cc80; --q7: #33d6ff; --qq: #ffd84a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px;
}
.book { max-width: 980px; margin: 0 auto; display: grid; gap: 26px; }
.book > * { min-width: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* masthead */
.mast { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.mast h1 { font: 400 clamp(44px, 9vw, 76px)/0.9 var(--display); margin: 0; letter-spacing: -0.01em; }
.mast h1 i { font-style: italic; color: var(--accent); }
.mast p { margin: 6px 0 0; color: var(--muted); max-width: 52ch; text-wrap: pretty; }
.mast-tools { display: grid; gap: 8px; justify-items: end; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 4px 10px; font: 500 12px var(--mono); color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* the file */
.open { display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; }
@media (max-width: 640px) { .open { grid-template-columns: 1fr; } }
.open .where { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.open .where b { font: 500 13px/1.6 var(--mono); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 4px; cursor: pointer; font: 600 14px var(--body); }
.btn.quiet { background: transparent; color: var(--accent); }
.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.notice { margin: 0; font-size: 14px; color: var(--muted); }
.notice strong { color: var(--mark); font-weight: 600; }
.error { border-left: 4px solid var(--death); padding: 8px 12px; margin: 0; background: color-mix(in srgb, var(--death) 9%, transparent); }

/* crew: characters */
.crew { display: flex; flex-wrap: wrap; gap: 8px; }
.crew button { border: 1px solid var(--rule); background: transparent; border-radius: 4px; padding: 6px 12px; cursor: pointer; text-align: left; display: grid; }
.crew button b { font: 600 15px var(--body); }
.crew button span { font: 12px var(--mono); color: var(--muted); }
.crew button[aria-pressed="true"] { border-color: var(--ink); background: var(--sheet); box-shadow: inset 0 -3px 0 var(--accent); }

.particulars { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0; padding: 0; list-style: none; font: 13px/1.5 var(--mono); color: var(--muted); }
.particulars li b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

/* sections of the book */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tabs a { padding: 8px 16px; text-decoration: none; color: var(--muted); font: 400 21px var(--display); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 520px) { .tabs a { padding: 8px 10px; font-size: 19px; } }
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }

/* the ledger */
.day h2 { font: 400 26px/1.2 var(--display); margin: 22px 0 6px; text-wrap: balance; }
.day h2 small { font: 12px var(--mono); color: var(--muted); margin-left: 8px; }
.ledger-wrap { overflow-x: auto; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 15px; }
.ledger th { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--ink); }
.ledger td { padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ledger td + td, .ledger th + th { border-left: 1px solid var(--rule); }
.ledger .t, .ledger .lv { font: 13px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
.ledger .place { color: var(--muted); font-size: 14px; width: 26%; }
.ledger .entry { min-width: 14em; }
.kind { display: inline-block; font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 5px; border: 1px solid currentColor; border-radius: 2px; margin-right: 8px; vertical-align: 2px; color: var(--muted); }
.k-level, .k-boss, .k-achievement, .k-money, .k-start { color: var(--mark); }
.k-death { color: var(--death); }
.k-note { color: var(--accent); }
tr.note .entry { font-style: italic; }
.inline-place { display: none; font: 12px/1.4 var(--mono); color: var(--muted); font-style: normal; margin-top: 2px; }
@media (max-width: 560px) {
  .ledger .place, .ledger th.place { display: none; }
  .inline-place { display: block; }
  .ledger .entry { min-width: 0; }
}
.empty { color: var(--muted); font-style: italic; margin: 18px 0; }

/* WoW link colors */
.q0 { color: var(--q0); } .q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); }
.q5 { color: var(--q5); } .q6 { color: var(--q6); } .q7 { color: var(--q7); } .qq { color: var(--qq); } .qx { color: inherit; }
.link { font-weight: 600; }

/* overview: level chart + trip lists */
.overview { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px 26px; align-items: start; margin-top: 18px; }
@media (max-width: 720px) { .overview { grid-template-columns: 1fr; } }
figure.chart { margin: 0; min-width: 0; }
.chart-title { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
svg.levels { width: 100%; height: auto; display: block; overflow: visible; }
svg.levels .grid { stroke: var(--rule); stroke-width: 1; }
svg.levels .axis { stroke: var(--ink); stroke-width: 1; }
svg.levels .tick { fill: var(--muted); font: 11px var(--mono); }
svg.levels .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
svg.levels .dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
svg.levels .dot.end { fill: var(--mark); }
svg.levels .endlabel { fill: var(--ink); font: 500 12px var(--mono); }
.trip { display: grid; gap: 14px; min-width: 0; }
.trip h3 { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.trip ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.trip li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding: 3px 0; font-size: 15px; min-width: 0; }
.trip li .n { font: 12px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* album */
.drop { border: 2px dashed var(--rule); border-radius: 6px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.drop p { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
figure.plate { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
.photo { aspect-ratio: 16 / 9; max-width: 100%; background: var(--sheet); border: 1px solid var(--rule); display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo.missing { background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 14px); }
.photo.missing span { font: 12px var(--mono); color: var(--muted); background: var(--sheet); padding: 4px 8px; border: 1px solid var(--rule); overflow-wrap: anywhere; max-width: 90%; text-align: center; }
figcaption { display: grid; gap: 2px; min-width: 0; }
figcaption .cap { font-style: italic; font-size: 17px; line-height: 1.35; }
figcaption .meta { font: 12px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* notebook */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
input[type="search"], input[type="text"], select { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; min-width: 0; }
.notes { columns: 2 300px; column-gap: 22px; }
article.note { break-inside: avoid; background: var(--sheet); border: 1px solid var(--rule); padding: 14px 16px; margin: 0 0 22px; display: grid; gap: 6px; }
article.note h3 { font: 400 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
article.note .pin { color: var(--mark); font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
article.note .body { margin: 0; overflow-wrap: anywhere; }
article.note .meta { font: 12px/1.5 var(--mono); color: var(--muted); }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.files li { font: 12px var(--mono); border: 1px solid var(--rule); padding: 2px 6px; }
.reminders { border-top: 2px solid var(--ink); padding-top: 10px; }
.reminders h2 { font: 400 24px var(--display); margin: 0 0 6px; }
.reminders ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.reminders li { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; border-bottom: 1px solid var(--rule); padding: 5px 0; }
.reminders li span { font: 13px var(--mono); color: var(--muted); }
.reminders li.done { color: var(--muted); text-decoration: line-through; }

/* images */
.prep { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 720px) { .prep { grid-template-columns: 1fr; } .prep .canvas-wrap { order: -1; } }
.prep form { display: grid; gap: 12px; }
.prep label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.canvas-wrap { background: repeating-conic-gradient(var(--hatch) 0 25%, var(--sheet) 0 50%) 0 0 / 16px 16px; border: 1px solid var(--rule); display: grid; place-items: center; padding: 10px; min-height: 220px; }
.canvas-wrap canvas, .canvas-wrap img { max-width: 100%; height: auto; image-rendering: auto; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
code, .mono { font: 13px var(--mono); overflow-wrap: anywhere; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.privacy { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .plate, article.note { transition: transform .15s; } }
</style>

<div class="book">
  <header class="mast">
    <div>
      <h1>Bitá<i>cora</i></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="mast-tools">
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <section class="open" aria-labelledby="open-title">
    <div class="where">
      <span id="open-title" data-t="openWhere"></span><br>
      <b>WTF\Account\<span data-t="account"></span>\SavedVariables\Bitacora_Datos.lua</b>
    </div>
    <div class="btns">
      <label class="btn" for="dbfile"><span data-t="openFile"></span><input type="file" id="dbfile" accept=".lua,text/plain"></label>
      <button type="button" class="btn quiet" id="demo" data-t="loadDemo"></button>
    </div>
    <p class="notice" id="status"></p>
  </section>

  <nav class="crew" id="crew" aria-label="Personajes"></nav>
  <ul class="particulars" id="particulars"></ul>

  <nav class="tabs" aria-label="Secciones">
    <a href="#diario" data-view="diario" data-t="tabJournal"></a>
    <a href="#album" data-view="album" data-t="tabAlbum"></a>
    <a href="#libreta" data-view="libreta" data-t="tabNotes"></a>
    <a href="#imagenes" data-view="imagenes" data-t="tabImages"></a>
  </nav>

  <main id="view"></main>

  <p class="privacy" data-t="privacy"></p>
</div>
