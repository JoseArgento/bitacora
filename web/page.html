<title>Bitácora de a bordo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Leé el diario, el álbum y la libreta de tus personajes de WoW Forever. Todo queda en tu compu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a ship's logbook. A ruled ledger (hour · level · entry · place) under a particulars line, with the album and notebook as further sections of the same book. */
:root {
  --paper: #e8ece4;      /* sage chart paper */
  --sheet: #f5f7f1;
  --ink: #18212c;
  --muted: #586470;
  --rule: #c5cec3;
  --accent: #24507a;     /* log ink blue: links, active tab */
  --accent-ink: #f5f7f1;
  --mark: #9a6b17;       /* brass: milestones */
  --death: #9e3328;
  --hatch: #d9dfd4;
  --q0: #6c6c6c; --q1: #18212c; --q2: #1d7a12; --q3: #0b5cad; --q4: #7a2db8; --q5: #b25600; --q6: #85682a; --q7: #00718f; --qq: #826400;
  --display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f151c; --sheet: #151d26; --ink: #e1e7ec; --muted: #94a1ad; --rule: #2a3642; --accent: #8db6df; --accent-ink: #0f151c;
    --mark: #d8a64c; --death: #e57e6d; --hatch: #1d2731;
    --q0: #9d9d9d; --q1: #ffffff; --q2: #4ade3a; --q3: #4aa3ff; --q4: #c387f5; --q5: #ff9a33; --q6: #e6cc80; --q7: #33d6ff; --qq: #ffd84a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f151c; --sheet: #151d26; --ink: #e1e7ec; --muted: #94a1ad; --rule: #2a3642; --accent: #8db6df; --accent-ink: #0f151c;
  --mark: #d8a64c; --death: #e57e6d; --hatch: #1d2731;
  --q0: #9d9d9d; --q1: #ffffff; --q2: #4ade3a; --q3: #4aa3ff; --q4: #c387f5; --q5: #ff9a33; --q6: #e6cc80; --q7: #33d6ff; --qq: #ffd84a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font: 16px/1.6 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 56px;
}
.book { max-width: 980px; margin: 0 auto; display: grid; gap: 26px; }
.book > * { min-width: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

/* masthead */
.mast { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.mast h1 { font: 400 clamp(44px, 9vw, 76px)/0.9 var(--display); margin: 0; letter-spacing: -0.01em; }
.mast h1 i { font-style: italic; color: var(--accent); }
.mast p { margin: 6px 0 0; color: var(--muted); max-width: 52ch; text-wrap: pretty; }
.mast-tools { display: grid; gap: 8px; justify-items: end; }
.lang { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 4px 10px; font: 500 12px var(--mono); color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* the file */
.open { display: grid; grid-template-columns: 1fr auto; gap: 10px 18px; align-items: center; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; }
@media (max-width: 640px) { .open { grid-template-columns: 1fr; } }
.open .where { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; }
.open .where b { font: 500 13px/1.6 var(--mono); color: var(--ink); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 14px; border-radius: 4px; cursor: pointer; font: 600 14px var(--body); }
.btn.quiet { background: transparent; color: var(--accent); }
.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.notice { margin: 0; font-size: 14px; color: var(--muted); }
.notice strong { color: var(--mark); font-weight: 600; }
.error { border-left: 4px solid var(--death); padding: 8px 12px; margin: 0; background: color-mix(in srgb, var(--death) 9%, transparent); }

/* crew: characters */
.crew { display: flex; flex-wrap: wrap; gap: 8px; }
.crew button { border: 1px solid var(--rule); background: transparent; border-radius: 4px; padding: 6px 12px; cursor: pointer; text-align: left; display: grid; }
.crew button b { font: 600 15px var(--body); }
.crew button span { font: 12px var(--mono); color: var(--muted); }
.crew button[aria-pressed="true"] { border-color: var(--ink); background: var(--sheet); box-shadow: inset 0 -3px 0 var(--accent); }

.particulars { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0; padding: 0; list-style: none; font: 13px/1.5 var(--mono); color: var(--muted); }
.particulars li b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

/* sections of the book */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tabs a { padding: 8px 16px; text-decoration: none; color: var(--muted); font: 400 21px var(--display); border-bottom: 3px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 520px) { .tabs a { padding: 8px 10px; font-size: 19px; } }
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 5px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }

/* the ledger */
.day h2 { font: 400 26px/1.2 var(--display); margin: 22px 0 6px; text-wrap: balance; }
.day h2 small { font: 12px var(--mono); color: var(--muted); margin-left: 8px; }
.ledger-wrap { overflow-x: auto; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 15px; }
.ledger th { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--ink); }
.ledger td { padding: 7px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
.ledger td + td, .ledger th + th { border-left: 1px solid var(--rule); }
.ledger .t, .ledger .lv { font: 13px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; width: 1%; }
.ledger .place { color: var(--muted); font-size: 14px; width: 26%; }
.ledger .entry { min-width: 14em; }
.kind { display: inline-block; font: 500 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 5px; border: 1px solid currentColor; border-radius: 2px; margin-right: 8px; vertical-align: 2px; color: var(--muted); }
.k-level, .k-boss, .k-achievement, .k-money, .k-start { color: var(--mark); }
.k-death { color: var(--death); }
.k-note { color: var(--accent); }
tr.note .entry { font-style: italic; }
.inline-place { display: none; font: 12px/1.4 var(--mono); color: var(--muted); font-style: normal; margin-top: 2px; }
@media (max-width: 560px) {
  .ledger .place, .ledger th.place { display: none; }
  .inline-place { display: block; }
  .ledger .entry { min-width: 0; }
}
.empty { color: var(--muted); font-style: italic; margin: 18px 0; }

/* WoW link colors */
.q0 { color: var(--q0); } .q1 { color: var(--q1); } .q2 { color: var(--q2); } .q3 { color: var(--q3); } .q4 { color: var(--q4); }
.q5 { color: var(--q5); } .q6 { color: var(--q6); } .q7 { color: var(--q7); } .qq { color: var(--qq); } .qx { color: inherit; }
.link { font-weight: 600; }

/* overview: level chart + trip lists */
.overview { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px 26px; align-items: start; margin-top: 18px; }
@media (max-width: 720px) { .overview { grid-template-columns: 1fr; } }
figure.chart { margin: 0; min-width: 0; }
.chart-title { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
svg.levels { width: 100%; height: auto; display: block; overflow: visible; }
svg.levels .grid { stroke: var(--rule); stroke-width: 1; }
svg.levels .axis { stroke: var(--ink); stroke-width: 1; }
svg.levels .tick { fill: var(--muted); font: 11px var(--mono); }
svg.levels .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
svg.levels .dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2; }
svg.levels .dot.end { fill: var(--mark); }
svg.levels .endlabel { fill: var(--ink); font: 500 12px var(--mono); }
.trip { display: grid; gap: 14px; min-width: 0; }
.trip h3 { font: 500 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.trip ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.trip li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding: 3px 0; font-size: 15px; min-width: 0; }
.trip li .n { font: 12px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* album */
.drop { border: 2px dashed var(--rule); border-radius: 6px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.drop p { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
.plates { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
figure.plate { margin: 0; display: grid; gap: 8px; align-content: start; min-width: 0; }
.photo { aspect-ratio: 16 / 9; max-width: 100%; background: var(--sheet); border: 1px solid var(--rule); display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo.missing { background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 14px); }
.photo.missing span { font: 12px var(--mono); color: var(--muted); background: var(--sheet); padding: 4px 8px; border: 1px solid var(--rule); overflow-wrap: anywhere; max-width: 90%; text-align: center; }
figcaption { display: grid; gap: 2px; min-width: 0; }
figcaption .cap { font-style: italic; font-size: 17px; line-height: 1.35; }
figcaption .meta { font: 12px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

/* notebook */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 14px; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
input[type="search"], input[type="text"], select { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 10px; min-width: 0; }
.notes { columns: 2 300px; column-gap: 22px; }
article.note { break-inside: avoid; background: var(--sheet); border: 1px solid var(--rule); padding: 14px 16px; margin: 0 0 22px; display: grid; gap: 6px; }
article.note h3 { font: 400 22px/1.2 var(--display); margin: 0; text-wrap: balance; }
article.note .pin { color: var(--mark); font: 500 11px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
article.note .body { margin: 0; overflow-wrap: anywhere; }
article.note .meta { font: 12px/1.5 var(--mono); color: var(--muted); }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.files li { font: 12px var(--mono); border: 1px solid var(--rule); padding: 2px 6px; }
.reminders { border-top: 2px solid var(--ink); padding-top: 10px; }
.reminders h2 { font: 400 24px var(--display); margin: 0 0 6px; }
.reminders ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.reminders li { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; border-bottom: 1px solid var(--rule); padding: 5px 0; }
.reminders li span { font: 13px var(--mono); color: var(--muted); }
.reminders li.done { color: var(--muted); text-decoration: line-through; }

/* images */
.prep { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 720px) { .prep { grid-template-columns: 1fr; } .prep .canvas-wrap { order: -1; } }
.prep form { display: grid; gap: 12px; }
.prep label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
.canvas-wrap { background: repeating-conic-gradient(var(--hatch) 0 25%, var(--sheet) 0 50%) 0 0 / 16px 16px; border: 1px solid var(--rule); display: grid; place-items: center; padding: 10px; min-height: 220px; }
.canvas-wrap canvas, .canvas-wrap img { max-width: 100%; height: auto; image-rendering: auto; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
code, .mono { font: 13px var(--mono); overflow-wrap: anywhere; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.privacy { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 12px; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .plate, article.note { transition: transform .15s; } }
</style>

<div class="book">
  <header class="mast">
    <div>
      <h1>Bitá<i>cora</i></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="mast-tools">
      <div class="lang" role="group" aria-label="Idioma / Language">

  let lang = "es";

  const state = { db: null, demo: true, char: null, filter: "milestones", section: null, query: "", shots: [], urls: [], prep: { file: null, img: null, size: 256, fit: "pad", name: "imagen.png" } };
  const $ = (s) => document.querySelector(s);
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);

  };

  // Level over time, drawn to scale: x = days since the journal started, y = level. One series, so no legend.
  function levelChart(c) {
    const pts = C.levelSeries(c);
    if (pts.length < 2) return null;
    const W = 640, H = 170, padL = 34, padR = 14, padT = 12, padB = 26;
    const t0 = pts[0].t, t1 = Math.max(pts[pts.length - 1].t, t0 + 3600);
    const maxLevel = Math.max(10, Math.ceil(pts[pts.length - 1].level / 10) * 10);
    const x = (t) => padL + ((t - t0) / (t1 - t0)) * (W - padL - padR);
    const y = (lv) => padT + (1 - (lv - 1) / (maxLevel - 1)) * (H - padT - padB);
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("class", "levels");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", L().levelChart);
    const add = (tag, attrs, text) => {
      const n = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      if (text != null) n.textContent = text;
      svg.append(n);
      return n;
    };
    const step = maxLevel <= 20 ? 5 : 10;
    for (let lv = step; lv <= maxLevel; lv += step) {
      add("line", { x1: padL, x2: W - padR, y1: y(lv), y2: y(lv), class: "grid" });
      add("text", { x: padL - 6, y: y(lv) + 4, class: "tick", "text-anchor": "end" }, String(lv));
    }
    add("text", { x: padL - 6, y: y(1) + 4, class: "tick", "text-anchor": "end" }, "1");
    add("line", { x1: padL, x2: W - padR, y1: y(1), y2: y(1), class: "axis" });
    const days = (t1 - t0) / 86400;
    add("text", { x: padL, y: H - 6, class: "tick" }, fmtDate(t0));
    add("text", { x: W - padR, y: H - 6, class: "tick", "text-anchor": "end" }, days >= 1 ? fmtDate(t1) : L().hoursLater(Math.round((t1 - t0) / 3600)));
    let d = `M${x(pts[0].t)},${y(pts[0].level)}`;
    for (let i = 1; i < pts.length; i++) d += ` H${x(pts[i].t)} V${y(pts[i].level)}`;
    add("path", { d, class: "line" });
    pts.forEach((p, i) => {
      const dot = add("circle", { cx: x(p.t), cy: y(p.level), r: i === pts.length - 1 ? 5 : 3.5, class: i === pts.length - 1 ? "dot end" : "dot" });
      const tip = document.createElementNS(ns, "title");
      tip.textContent = `${L().level} ${p.level} · ${p.d || ""}`;
      dot.append(tip);
    });
    const last = pts[pts.length - 1];
    add("text", { x: Math.min(x(last.t), W - padR) - 8, y: y(last.level) - 9, class: "endlabel", "text-anchor": "end" }, `${L().level} ${last.level}`);
    return el("figure", { class: "chart" }, el("figcaption", { class: "chart-title", text: L().levelChart }), svg);
  }

  function tripSummary(c) {
    const s = C.tripStats(c);
    if (!s.deaths.length && !s.bosses.length && !s.loot.length) return null;
    const block = (title, items) => (items.length ? el("div", {}, el("h3", { text: title }), el("ul", {}, items)) : null);
    return el("div", { class: "trip" },
      block(L().tripBosses, s.bosses.map((b) => el("li", {}, el("span", { text: b.name }), el("span", { class: "n", text: b.count > 1 ? `×${b.count}` : (b.first || "").slice(0, 10) })))),
      block(L().tripDeaths, s.deaths.slice(0, 5).map((d) => el("li", {}, el("span", { text: d.zone }), el("span", { class: "n", text: `×${d.count}` })))),
      block(L().tripLoot, s.loot.slice(-5).reverse().map((l) => el("li", {}, el("span", { html: C.markupToHtml(l.link) }), el("span", { class: "n", text: (l.d || "").slice(0, 10) })))));
  }

  // ------------------------------------------------------------ album
  function renderAlbum() {
    const c = current();
    const root = el("div", { class: "album", style: "display:grid;gap:22px" });
    const input = el("input", { type: "file", id: "shots", accept: "image/*", multiple: true, onchange: (e) => { addShots(e.target.files); e.target.value = ""; } });
    const drop = el("div", { class: "drop" },
      el("p", { text: L().dropShots }),
      el("label", { class: "btn quiet", for: "shots" }, L().chooseShots, input));
    ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
    ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
    drop.addEventListener("drop", (e) => addShots(e.dataTransfer.files));
    root.append(drop);
    const album = c ? c.album.slice().reverse() : [];
    if (!album.length) {
      root.append(el("p", { class: "empty", text: L().albumEmpty }));
    }
    const { pairs, loose } = C.matchShots(album, state.shots);
    if (album.length) {
      root.append(el("div", { class: "plates" }, pairs.map(({ entry, file }) => {
        const fname = `WoWScrnShot_${entry.stamp}.jpg`;
        const photo = file
          ? el("div", { class: "photo" }, el("img", { src: urlFor(file), alt: entry.caption || entry.zone || "" }))
          : el("div", { class: "photo missing" }, el("span", {}, fname, el("br"), L().missingHint));
        const where = [entry.sub, entry.zone].filter(Boolean).join(", ");
        const bits = [entry.d, where, entry.group.length ? L().with(entry.group.join(", ")) : null, entry.level ? `${L().level} ${entry.level}` : null];
        return el("figure", { class: "plate" }, photo,
          el("figcaption", {},
            entry.caption ? el("span", { class: "cap", text: entry.caption }) : null,
            el("span", { class: "meta", text: bits.filter(Boolean).join(" · ") })));
      })));
    }
    if (loose.length) {
      root.append(el("h2", { class: "day", style: "font:400 24px var(--display);margin:6px 0 0", text: L().looseTitle(loose.length) }));
      root.append(el("div", { class: "plates" }, loose.map((f) =>
        el("figure", { class: "plate" }, el("div", { class: "photo" }, el("img", { src: urlFor(f), alt: f.name })),
          el("figcaption", {}, el("span", { class: "meta", text: f.name }))))));
    }
    return root;
  }
  function addShots(list) {
    const files = Array.from(list || []).filter((f) => /^image\//.test(f.type) || /\.(jpe?g|png|tga)$/i.test(f.name));
    const known = new Set(state.shots.map((f) => f.name + f.size));
    for (const f of files) if (!known.has(f.name + f.size)) state.shots.push(f);
    render();
  }
  const urlCache = new Map();
  function urlFor(file) {
    if (!urlCache.has(file)) urlCache.set(file, URL.createObjectURL(file));
    return urlCache.get(file);
  }

  // ------------------------------------------------------------ notebook
  function renderNotes() {
    const db = state.db;
    const root = el("div", { style: "display:grid;gap:18px" });
    const search = el("input", { type: "search", id: "q", placeholder: L().search, "aria-label": L().search, value: state.query });
    search.addEventListener("input", () => { state.query = search.value; drawNotes(); });
    const copy = el("button", { type: "button", class: "btn quiet", text: L().copyNotes, onclick: () => copyText(C.notesMarkdown(db, lang), copy, L().copyNotes) });
    const chips = el("div", { class: "chips", role: "group" },
      el("button", { type: "button", "aria-pressed": String(state.section == null), text: L().allSections, onclick: () => { state.section = null; render(); } }),
      db.sections.map((s) => el("button", { type: "button", "aria-pressed": String(state.section === s.id), text: s.name, onclick: () => { state.section = s.id; render(); } })));
    root.append(el("div", { class: "bar" }, chips, el("div", { class: "copy-row" }, search, copy)));
    const holder = el("div");
    root.append(holder);
    function drawNotes() {
      const words = state.query.toLowerCase().split(/\s+/).filter(Boolean);
      const c = current();
      const notes = db.notes
        .filter((n) => state.section == null || n.section === state.section)
        .filter((n) => !n.char || !c || n.char === c.key)
        .filter((n) => { const hay = C.plain(`${n.title || ""}\n${n.body || ""}\n${n.attach ? n.attach.label || "" : ""}`).toLowerCase(); return words.every((w) => hay.includes(w)); })
        .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || (b.updated || 0) - (a.updated || 0));
      if (!notes.length) { holder.replaceChildren(el("p", { class: "empty", text: L().notesEmpty })); return; }
      holder.replaceChildren(el("div", { class: "notes" }, notes.map((n) => {
        const meta = [n.attach ? L().attached(n.attach.label || n.attach.key) : null, n.char ? L().onlyChar(n.char) : null, fmtDate(n.updated)].filter(Boolean).join(" · ");
        return el("article", { class: "note" },
          n.pinned ? el("span", { class: "pin", text: L().pinned }) : null,
          el("h3", { text: n.title || C.plain(n.body).split("\n")[0] || "—" }),
          n.body ? el("p", { class: "body", html: C.markupToHtml(n.body) }) : null,
          n.images.length ? el("ul", { class: "files" }, n.images.map((f) => el("li", { text: f }))) : null,
          el("span", { class: "meta", text: meta }));
      })));
    }
    drawNotes();
    const c = current();
    const rem = db.reminders.filter((r) => !r.char || !c || r.char === c.key);
    if (rem.length) {
      root.append(el("section", { class: "reminders" }, el("h2", { text: L().reminders }),
        el("ul", {}, rem.map((r) => {
          const f = L().rKinds[r.kind];
          const when = f ? f(r.value || "") : r.kind;
          return el("li", { class: r.done ? "done" : "" }, el("b", { text: r.text, style: "font-weight:400" }),
            el("span", { text: [when, r.repeating ? L().repeats : null, r.done ? L().done : null, r.char].filter(Boolean).join(" · ") }));
        }))));
    }
    return root;
  }

  // ------------------------------------------------------------ images
  function renderImages() {
    const P = state.prep;
    const root = el("div", { class: "prep" });
    const canvas = el("canvas", { id: "prepcanvas", width: P.size, height: P.size });
    const sizes = [64, 128, 256, 512, 1024];
    const nameInput = el("input", { type: "text", id: "imgname", value: P.name, spellcheck: "false" });
    const status = el("p", { class: "notice", role: "status" });
    const steps = el("ol", { class: "steps" });
    const form = el("form", { onsubmit: (e) => e.preventDefault() },
      el("h2", { style: "font:400 26px/1.2 var(--display);margin:0", text: L().prepTitle }),
      el("p", { class: "notice", text: L().prepIntro }),
      el("label", {}, L().pick, el("input", { type: "file", id: "imgfile", accept: "image/*", onchange: async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        P.file = f;
        P.img = await loadImage(f);
        P.name = C.imageName(f.name);
        nameInput.value = P.name;
        draw();
      } })),
      el("label", {}, L().size, el("select", { id: "imgsize", onchange: (e) => { P.size = Number(e.target.value); draw(); } },
        sizes.map((s) => el("option", { value: s, selected: s === P.size }, `${s} × ${s}`)))),
      el("label", {}, L().fit, el("select", { id: "imgfit", onchange: (e) => { P.fit = e.target.value; draw(); } },
        [["pad", L().fitPad], ["crop", L().fitCrop], ["stretch", L().fitStretch]].map(([v, t]) => el("option", { value: v, selected: v === P.fit }, t)))),
      el("label", {}, L().name, nameInput),
      el("div", { class: "copy-row" }, el("button", { type: "button", class: "btn", id: "savepng", text: L().save, onclick: savePng }), status),
      el("p", { class: "notice", text: L().saveHint }),
      el("div", {}, el("strong", { text: L().stepsTitle }), steps));
    nameInput.addEventListener("change", () => { P.name = C.imageName(nameInput.value); nameInput.value = P.name; draw(); });
    const preview = el("div", { class: "canvas-wrap" }, P.img ? canvas : el("p", { class: "empty", text: L().prepEmpty }));
    root.append(form, preview);
    function draw() {
      steps.replaceChildren(el("li", { html: L().step1(P.name) }), el("li", { html: L().step2 }), el("li", { html: L().step3(P.name) }));
      if (!P.img) return;
      preview.replaceChildren(canvas);
      canvas.width = canvas.height = P.size;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, P.size, P.size);
      const w = P.img.naturalWidth, h = P.img.naturalHeight;
      if (P.fit === "stretch") ctx.drawImage(P.img, 0, 0, P.size, P.size);
      else {
        const scale = P.fit === "pad" ? Math.min(P.size / w, P.size / h) : Math.max(P.size / w, P.size / h);
        const dw = w * scale, dh = h * scale;
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(P.img, (P.size - dw) / 2, (P.size - dh) / 2, dw, dh);
      }
    }
    async function savePng() {
      if (!P.img) return;
      const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
      try {
        const done = await saveFile(P.name, blob);
        status.textContent = done ? L().saved : "";
      } catch (e) {
        status.textContent = L().saveDeclined;
      }
    }
    draw();
    return root;
  }
  function loadImage(file) {
    return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = urlFor(file); });
  }

  // Inside claude.ai the page offers files through the viewer's "downloads" capability; as a plain local
  // file it uses a normal download link.
  async function saveFile(filename, blob) {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use("downloads");
      if (!dl) return false;
      await dl.save({ filename, data: blob });
      return true;
    }
    const a = el("a", { href: URL.createObjectURL(blob), download: filename });
    document.body.append(a);
    a.click();
    a.remove();
    return true;
  }
  async function copyText(text, button, label) {
    try {
      await navigator.clipboard.writeText(text);
      button.textContent = L().copied;
    } catch (e) {
      button.textContent = L().copyFail;
      const area = el("textarea", { style: "width:100%;min-height:200px;font:13px var(--mono)", readonly: true }, text);
      button.closest(".bar, .journal, div").after(area);
      area.select();
    }
    setTimeout(() => { button.textContent = label; }, 2000);
  }

  // ------------------------------------------------------------ routing
  const VIEWS = { diario: renderJournal, album: renderAlbum, libreta: renderNotes, imagenes: renderImages };
  function viewName() {
    const h = location.hash.replace("#", "");
    return VIEWS[h] ? h : "diario";
  }
  function render() {
    renderHeader();
    const name = viewName();
    document.querySelectorAll(".tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === name ? "page" : "false"));
    $("#view").replaceChildren(state.db || name === "imagenes" ? VIEWS[name]() : el("p", { class: "empty" }));
  }
  window.addEventListener("hashchange", render);
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => {
    lang = b.dataset.lang;
    try { localStorage.setItem("bitacora-lang", lang); } catch (e) {}
    render();
  }));

  load(BITACORA_DEMO, "BitacoraDB.lua", true);
})();
</script>
